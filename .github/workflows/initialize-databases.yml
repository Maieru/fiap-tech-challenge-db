name: Initialize databases and verify MongoDB
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      role_arn:
        type: string
        required: true
      execution_image:
        type: string
        required: true
    secrets:
      REPOSITORIES_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  initialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    if: github.repository == 'Maieru/fiap-tech-challenge' && github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      EXECUTION_IMAGE: ${{ inputs.execution_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Maieru/fiap-tech-challenge-db
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validar nomes e referencias dos segredos Kubernetes
        run: node --test scripts/platform/bootstrap-secrets.test.mjs
      - name: Autenticar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1
      - run: bash scripts/platform/install-kubectl.sh
      - run: node scripts/platform/initialize.mjs
